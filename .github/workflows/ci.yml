name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile runtime
        run: |
          python -m py_compile src/intention_engine_core/__init__.py
          python -m py_compile src/intention_engine_core/__main__.py
          python -m py_compile src/intention_engine_core/cli.py
          python -m py_compile src/intention_engine_core/path_resolver.py
          python -m py_compile src/intention_engine_core/runtime.py

      - name: Bootstrap workspace
        run: bash ops/bootstrap-workspace.sh

      - name: Editable install smoke
        run: |
          python -m pip install -e .
          python -c "import intention_engine_core; print('ok')"

      - name: Run unit/integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate config
        run: intention-engine --config config/runtime.json validate --json

      - name: Dry-run micro loop
        run: intention-engine --config config/runtime.json run --mode micro --dry-run

      - name: Status smoke
        run: intention-engine --config config/runtime.json status --json

      - name: Enforce no-wrapper references in active contract docs/tests/cron/ci
        run: |
          if rg -n "ops/ie_(micro|deep|status)\\.sh" README.md docs/operations docs/reference cron agents tests .github/workflows/ci.yml; then
            echo "Found wrapper references in active contract surfaces."
            exit 1
          fi
