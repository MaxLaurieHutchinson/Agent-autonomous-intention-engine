name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile runtime
        run: python -m py_compile scripts/intention_engine.py

      - name: Init runtime
        run: ./ops/init.sh

      - name: Runtime status
        run: python scripts/intention_engine.py status

      - name: Dry-run micro loop
        run: python scripts/intention_engine.py run --mode micro --dry-run --force

      - name: Generate brief
        run: python scripts/intention_engine.py brief
