name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile runtime
        run: |
          python -m py_compile src/intention_engine_core/__init__.py
          python -m py_compile src/intention_engine_core/__main__.py
          python -m py_compile src/intention_engine_core/cli.py
          python -m py_compile src/intention_engine_core/path_resolver.py
          python -m py_compile src/intention_engine_core/runtime.py

      - name: Bootstrap workspace
        run: bash ops/bootstrap-workspace.sh

      - name: Editable install smoke
        run: |
          python -m pip install -e .
          python -c "import intention_engine_core; print('ok')"

      - name: Run unit/integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate config
        run: PYTHONPATH=src python -m intention_engine_core.cli validate --json

      - name: Dry-run micro loop
        run: bash ops/ie_micro.sh --dry-run

      - name: Status smoke
        run: bash ops/ie_status.sh
