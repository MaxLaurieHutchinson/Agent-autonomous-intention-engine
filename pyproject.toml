[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intention-engine"
version = "2.3.0"
description = "Single deployable Intention Engine with deterministic runtime, safe guardrails, and canonical CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
intention-engine = "intention_engine_core.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
